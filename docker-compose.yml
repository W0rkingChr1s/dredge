# dredge als Container – interner Scheduler (`daemon`) läuft im Vordergrund,
# es braucht also keinen Cron und kein systemd auf dem Host.
#
# Einmalige Einrichtung:
#   mkdir -p config
#   sudo chown 10001:10001 config          # UID/GID des Nutzers im Image
#   docker compose run --rm dredge setup   # schreibt ./config/config.yaml
#   docker compose up -d
#
# Läuft der Container später als anderer Nutzer (siehe `user:` unten), muss
# ./config diesem Nutzer gehören – sonst kann `setup` nichts speichern.
#
# Zugriff auf die Engine-API: siehe die zwei Varianten unten. Empfohlen ist
# der socket-proxy – dredge braucht schreibenden Zugriff, und ein direkt
# gemounteter Socket gibt effektiv Root auf dem Host.

services:
  dredge:
    image: ghcr.io/w0rkingchr1s/dredge:latest
    # Alternativ lokal bauen statt das Image zu ziehen:
    # build:
    #   context: .
    #   args:
    #     VERSION: "dev"
    restart: unless-stopped
    # Standard ist UID/GID 10001 aus dem Image. Wer ./config lieber dem
    # eigenen Account gibt, setzt hier z. B. user: "1000:1000".
    # user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: "UTC"
      DREDGE_CONFIG: /config/config.yaml
    volumes:
      - ./config:/config              # config.yaml, per `setup` erzeugt
      - dredge_data:/var/lib/dredge   # Audit-Log (history.jsonl)

    # ---- Variante A (empfohlen): socket-proxy ----------------------------
    # In config.yaml:  docker.host: http://dockerproxy:2375
    # Beide Container müssen im selben Netzwerk hängen.
    depends_on:
      - dockerproxy

    # ---- Variante B: Socket direkt mounten -------------------------------
    # Einfacher, aber deutlich weniger abgesichert. Dann den dockerproxy-
    # Service unten *und* das depends_on oben löschen und in config.yaml
    # setzen:  docker.host: unix:///var/run/docker.sock
    # Der Container braucht dafür Zugriff auf den Socket, also entweder
    # user: "0:0" oder die GID der docker-Gruppe des Hosts:
    #   group_add: ["999"]
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock

  # Tecnativa docker-socket-proxy – gibt gezielt nur die Endpunkte frei,
  # die dredge braucht. POST=1 schaltet auch die nötigen DELETE-/prune-
  # Aufrufe frei; ohne das kann dredge nur scannen, nicht aufräumen.
  dockerproxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      PING: 1
      IMAGES: 1
      VOLUMES: 1
      NETWORKS: 1
      CONTAINERS: 1
      SYSTEM: 1
      BUILD: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  dredge_data:
